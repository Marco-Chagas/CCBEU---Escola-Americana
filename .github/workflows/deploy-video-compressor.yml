name: Publicar o compressor de vídeo

on:
  push:
    branches: [main]
    paths:
      - "video-compressor/**"
      - ".github/workflows/deploy-video-compressor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # liga o GitHub Pages do repositorio automaticamente na primeira vez,
          # para nao depender de ninguem mexer em Settings -> Pages
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: video-compressor
      - id: deployment
        uses: actions/deploy-pages@v4
